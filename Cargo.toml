[package]
authors = ["Ben Ruijl <benruyl@gmail.com>"]
categories = ["science"]
description = "A blazing fast computer algebra system, with community extensions"
edition = "2024"
keywords = ["algebra", "symbolic", "manipulation", "mathematics", "physics"]
license = "MIT"
name = "symbolica_community"
readme = "Readme.md"
repository = "https://github.com/benruijl/symbolica-community"
rust-version = "1.89"
version = "3.0.0"
exclude = ["dist"]

[[bin]]
name = "stub_gen"
required-features = ["python_stubgen"]

[lib]
name = "symbolica_community"
crate-type = ["rlib", "cdylib"]

# Reuse optimized Symbolica while keeping the local Feynkit crates quick to rebuild.
[profile.dev.package.symbolica]
opt-level = 2

# Optimize browser downloads separately from native release performance.
[profile.release-small]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = "symbols"

[features]
default = ["module", "native"]
module = ["pyo3/abi3", "symbolica/python_abi3"] # incompatible with stub_gen
# Keep the system allocator: mimalloc can crash after Python's importing thread exits.
native = ["symbolica/tracing_max_level_info", "symbolica/integer-gmp", "symbolica/float-mpfr", "symbolica/native_code_generation", "spynso3/native", "feynkit-py/native", "example_extension/native"]
wasm = ["symbolica/wasm", "spynso3/wasm", "feynkit-py/wasm", "example_extension/wasm"]
python_stubgen = [
    "native",
    "pyo3-stub-gen",
    "symbolica/python_stubgen",
    "spynso3/python_stubgen",
    "feynkit-py/python_stubgen",
    "vakint/python_stubgen",
    "example_extension/python_stubgen",
]

[dependencies]
example_extension = { path = "example_extension", default-features = false }
spynso3 = { path = "../../gammaloop/feynkit-rich-display/crates/spynso3", default-features = false }
# Aggregates the cff, generator, graph, tensor, model, and kinematics bindings.
feynkit-py = { path = "../../gammaloop/feynkit-rich-display/crates/feynkit-py", default-features = false, features = ["ufo"] }
symbolica = { version = "3.0", default-features = false, features = ["python_export"] }
symbolica-integrate = { version = "2.0.1", default-features = false, features = ["compressed-step-metadata"] }
pyo3 = { version = "0.28" }
pyo3-stub-gen = { version = "0.17", optional = true, default-features = false, features = [
    "numpy",
] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Compile the IBP bridge into the host extension to share native Symbolica atoms.
rustred-feynkit = { path = "../../rustred/crates/rustred-feynkit" }
# Share the host kernel; OneLOop currently requires native numeric/JIT support.
oneloop-python = { path = "../../oneloopmaster/python", default-features = false, features = ["community"] }
# Vakint currently requires native dependencies, including GMP/MPFR.
vakint = { path = "../../gammaloop/feynkit-rich-display/crates/vakint", features = ["symbolica_community_module"] }

# Match OneLOop's validated evaluator caches and unify all HEP Atom types.
[patch.crates-io]
symbolica = { git = "https://github.com/symbolica-dev/symbolica", rev = "a19c760dd567c239f30d87e4e924ca2f8b8457ab" }
numerica = { git = "https://github.com/symbolica-dev/symbolica", rev = "a19c760dd567c239f30d87e4e924ca2f8b8457ab" }
graphica = { git = "https://github.com/symbolica-dev/symbolica", rev = "a19c760dd567c239f30d87e4e924ca2f8b8457ab" }

# Keep portable tensor rendering aligned with the linked Symbolica export format.
[patch."https://github.com/symbolica-dev/symbolica-typst-plugin"]
symbolica-typst-atom-payload = { path = "../../symbolica-typst-plugin/crates/atom-payload" }
