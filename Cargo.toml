[package]
authors = ["Ben Ruijl <benruyl@gmail.com>"]
categories = ["science"]
description = "A blazing fast computer algebra system with community enhancements"
edition = "2021"
keywords = ["algebra", "symbolic", "manipulation", "mathematics", "physics"]
license = "MIT"
name = "symbolica_community"
readme = "Readme.md"
repository = "https://github.com/benruijl/symbolica-community"
rust-version = "1.73"
version = "0.1.0"

[features]

default = [ "spenso", "algebraic_simplification"]
algebraic_simplification = ["dep:spenso", "dep:spenso-macros","dep:linnet"]
# vakint = ["dep:vakint"]
spenso = ["dep:spenso","dep:linnet"]

[profile.release]
codegen-units = 1
lto = true

[profile.dev-optim]
inherits = "dev"
opt-level = 3

[[bin]]
name = "stub_gen"
doc = false

[lib]
name = "symbolica_community"
crate-type = ["lib", "cdylib"]

[dependencies]
symbolica = { version = "0.16.0", features = ["python_no_module"] }
pyo3 = { version = "0.24.0", features = ["abi3-py37", "anyhow", "num-complex"] }

anyhow = "*"
# vakint = { git = "https://github.com/alphal00p/vakint", branch = "vk_for_sb_0_16_latest", optional=true }
spenso = { version = "0.4.1", optional = true, features = ["shadowing"] }
linnet = {version="0.5.1",optional=true}
itertools = "0.13.0"
delegate = "0.13.1"
auto_enums = "0.8.6"
thiserror = "1.0.65"
pyo3-stub-gen = "0.7.0"
env_logger = "0.11.5"

spenso-macros = {git="https://github.com/alphal00p/spenso",rev="6684d4c84dbf1523c97b741746821aa6c2eb037c",features=["shadowing"],optional=true}

# spenso-macros = {path = "../spenso/spenso-macros"}
[patch.crates-io]
# symbolica={path="../symbolica"}
symbolica = { git = "https://github.com/alphal00p/symbolica", rev = "2f306d814359de6397817060ba2deae046351828" }
# spenso = { path = "../spenso/spenso"}
spenso={git="https://github.com/alphal00p/spenso",rev="6684d4c84dbf1523c97b741746821aa6c2eb037c"}
# symbolica={git="https://github.com/alphal00p/symbolica",rev="d1e34cbadce9c7b196063d92602c7a15ca2305b2"}
