[package]
authors = ["Ben Ruijl <benruyl@gmail.com>"]
categories = ["science"]
description = "A blazing fast computer algebra system with community enhancements"
edition = "2021"
keywords = ["algebra", "symbolic", "manipulation", "mathematics", "physics"]
license = "MIT"
name = "symbolica_community"
readme = "Readme.md"
repository = "https://github.com/benruijl/symbolica-community"
rust-version = "1.73"
version = "0.1.0"

[features]

default = [ "spenso", "algebraic_simplification"]
algebraic_simplification = ["dep:spenso", "dep:spenso-macros","dep:linnet"]
# vakint = ["dep:vakint"]
spenso = ["dep:spenso","dep:linnet","dep:bitvec"]
bincode = ["dep:bincode", "dep:bincode-trait-derive"]
python=["dep:pyo3","dep:pyo3-stub-gen","symbolica/python_no_module"]

[profile.release]
codegen-units = 1
lto = true

[profile.dev-optim]
inherits = "dev"
opt-level = 3

[[bin]]
name = "stub_gen"
doc = false
required-features = ["python"]

[lib]
name = "symbolica_community"
crate-type = ["lib", "cdylib"]

[dependencies]
symbolica = { version = "0.16.0", features = [] }
pyo3 = { version = "0.24.0", features = ["abi3-py37", "anyhow", "num-complex"] ,optional=true}

anyhow = "*"
# vakint = { git = "https://github.com/alphal00p/vakint", branch = "vk_for_sb_0_16_latest", optional=true }
spenso = { version = "0.4.1", optional = true, features = ["shadowing"] }
bitvec = { version = "1.0.1", optional=true,features = ["serde"] }
linnet = {version="0.6.2",optional=true}

itertools = "0.13.0"
delegate = "0.13.1"
auto_enums = "0.8.6"
thiserror = "1.0.65"
pyo3-stub-gen = {version = "0.7.0",optional=true}
env_logger = "0.11.5"
bincode = {version = "2.0", optional = true}
bincode-trait-derive = {git = "https://github.com/alphal00p/bincode-trait-derive.git", optional = true,rev="c092cba7f80c867fd5646cf68312e1f4f9010658"}

spenso-macros = {git="https://github.com/alphal00p/spenso",rev="d27b746e8168ab1380de0e10b483870b04bbf23d",features=["shadowing"],optional=true}

# spenso-macros = {path = "../spenso/spenso-macros"}
[patch.crates-io]
# symbolica={path="../symbolica"}
symbolica = { git = "https://github.com/alphal00p/symbolica", rev = "438f8bdbd49eda7fae58f079cdcbee316ad76ae7" }
# linnet = {git ="https://gi?thub.com/alphal00p/linnet", rev = "d8636fbfed7f924ea240fcb73783f1845a10ba91"}
# spenso = { path = "../spenso/spenso"}
spenso={git="https://github.com/alphal00p/spenso",rev="d27b746e8168ab1380de0e10b483870b04bbf23d"}
# symbolica={git="https://github.com/alphal00p/symbolica",rev="d1e34cbadce9c7b196063d92602c7a15ca2305b2"}
