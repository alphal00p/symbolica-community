[package]
authors = ["Ben Ruijl <benruyl@gmail.com>"]
categories = ["science"]
description = "A blazing fast computer algebra system, with community extensions"
edition = "2021"
keywords = ["algebra", "symbolic", "manipulation", "mathematics", "physics"]
license = "MIT"
name = "symbolica_community"
readme = "Readme.md"
repository = "https://github.com/benruijl/symbolica-community"
rust-version = "1.73"
version = "0.18.0"


[[bin]]
name = "stub_gen"
required-features = ["python_stubgen"]

[lib]
name = "symbolica_community"
crate-type = ["rlib", "cdylib"]

[features]
python_stubgen = [
    "pyo3-stub-gen",
    "symbolica/python_stubgen",
    "spynso3/python_stubgen",
    "idenso/python_stubgen",
    "vakint/python_stubgen",
    "example_extension/python_stubgen"
]

[dependencies]
example_extension = { path = "example_extension" }
idenso = { version = "0.2.3", features = ["bincode", "python"] }
symbolica = { version = "0.19", features = ["python_export"] }
pyo3 = "0.27"
pyo3-stub-gen = { version = "0.16", optional = true, default-features = false }
spynso3 = { version = "0.1" }
vakint = { git = "https://github.com/alphal00p/vakint", rev = "f625281aecc2c8d03d0a490f88cd83e2d0ba11f5", features = [
    "symbolica_community_module",
] }

[patch.crates-io]
spynso3 = { git = "https://github.com/alphal00p/spenso", rev = "ba43c108c99eca3ca39af78549e9cfa994f70b1d" }
idenso= {git= "https://github.com/alphal00p/spenso", rev = "ba43c108c99eca3ca39af78549e9cfa994f70b1d" }
spenso= {git= "https://github.com/alphal00p/spenso", rev = "ba43c108c99eca3ca39af78549e9cfa994f70b1d" }
spenso-hep-lib = {git= "https://github.com/alphal00p/spenso", rev = "ba43c108c99eca3ca39af78549e9cfa994f70b1d" }

