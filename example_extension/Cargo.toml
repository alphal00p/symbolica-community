[package]
name = "example_extension"
version = "0.1.0"
edition = "2024"


[lib]
name = "example_extension"
crate-type = ["rlib", "cdylib"]

[dependencies]
symbolica = { version = "3.0", default-features = false, features = ["python_export"] }
pyo3 = "0.28"
pyo3-stub-gen = { version = "0.17", optional = true, default-features = false }

[features]
default = ["native"]
# An extension must not select a global allocator for its embedding host.
native = ["symbolica/tracing_max_level_info", "symbolica/integer-gmp", "symbolica/float-mpfr", "symbolica/native_code_generation"]
wasm = ["symbolica/wasm"]
python_stubgen = ["pyo3-stub-gen", "symbolica/python_stubgen"]
